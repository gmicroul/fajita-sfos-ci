name: Build sailfishos-docker for fajita (5.1.0.11)
'on':
  repository_dispatch:
  workflow_dispatch:
    inputs:
      release:
        description: "SailfishOS release to build (需与 ks 内社区源兼容，见 README)"
        required: false
        default: "5.1.0.11"

env:
  VENDOR: oneplus
  DEVICE: fajita
  PORT_ARCH: aarch64
  # 注意: fajita 社区适配要求 pulseaudio >= 15.0，5.0.0.67 只有 14.2，
  # 基础版本固定在 5.1.x（ks 内社区/chum/storeman 源按 5.1 写死）。
  RELEASE: ${{ inputs.release || '5.1.0.11' }}
  RELEASE_TAG: sailfishos-docker-5.1.0.11-fajita
  DOCKER_ARTIFACTS_DIR: /workspace/docker-artifacts
  # Docker 内核产物来源: 沿用 gmicroul/fajita-sfos-docker-ci 的
  # sailfishos-docker-5.0.0.67-fajita release（内核为 hybris 16.0，与 5.1 基础兼容，
  # 与注入脚本内 sha256 常量配套）
  BOOT_IMG_URL: https://github.com/gmicroul/fajita-sfos-docker-ci/releases/download/sailfishos-docker-5.0.0.67-fajita/boot_a-docker-v2.img
  KERNEL_RPM_URL: https://github.com/gmicroul/fajita-sfos-docker-ci/releases/download/sailfishos-docker-5.0.0.67-fajita/docker-kernel-oneplus6t-4.9.209_docker-1.g5eb4c03127.aarch64.rpm
  BACKUP_BOOT_URL: https://github.com/gmicroul/fajita-sfos-docker-ci/releases/download/sailfishos-docker-5.0.0.67-fajita/boot_a-backup-before-docker.img

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker container
        run: |
          sudo docker pull coderus/sailfishos-platform-sdk-base:latest
          sudo docker run --privileged --name sailfish-sdk -d \
            coderus/sailfishos-platform-sdk-base:latest tail -f /dev/null

      - name: Download Docker kernel artifacts (runner side)
        run: |
          mkdir -p docker-artifacts
          curl -fsSL -o docker-artifacts/boot_a-docker-v2.img "$BOOT_IMG_URL"
          curl -fsSL -o docker-artifacts/docker-kernel-oneplus6t-4.9.209_docker-1.g5eb4c03127.aarch64.rpm "$KERNEL_RPM_URL"
          curl -fsSL -o docker-artifacts/boot_a-backup-before-docker.img "$BACKUP_BOOT_URL"
          ls -la docker-artifacts/

      - name: Verify artifact checksums
        run: |
          echo "b17c9fbd28529bcb4fe1e8514a74e9dfd991bb28470a3d6b662089f9b202783d  docker-artifacts/boot_a-docker-v2.img" | sha256sum -c -
          echo "b926aefdf2c60bce02a021b945caa55a9b82b4c6f5adb5a0a305b6590cda93c5  docker-artifacts/docker-kernel-oneplus6t-4.9.209_docker-1.g5eb4c03127.aarch64.rpm" | sha256sum -c -
          echo "3cf5250c2831ce268b095c4c6489a483b258f8c1b0fe7609b4599137092a817a  docker-artifacts/boot_a-backup-before-docker.img" | sha256sum -c -

      - name: Extract rpm payload (pure python, no rpm/cpio needed)
        run: |
          python3 scripts/extract-rpm.py \
            docker-artifacts/docker-kernel-oneplus6t-4.9.209_docker-1.g5eb4c03127.aarch64.rpm \
            docker-artifacts/payload
          test -f docker-artifacts/payload/lib/modules/4.9.209-hybris-g5eb4c03127-dirty/wlan.ko
          test -f docker-artifacts/payload/usr/share/docker-kernel-oneplus6t/boot.img
          test -f docker-artifacts/payload/usr/sbin/install-docker-kernel

      - name: Copy files into Docker container
        run: |
          sudo docker cp . sailfish-sdk:/workspace/
          # 尾部加 / 明确"拷贝目录内容"，避免 docker cp 目录语义歧义
          sudo docker exec sailfish-sdk mkdir -p /workspace/docker-artifacts
          sudo docker cp docker-artifacts/. sailfish-sdk:/workspace/docker-artifacts/

      - name: Verify artifacts layout in container
        run: |
          sudo docker exec sailfish-sdk sh -c \
            "ls -la /workspace/docker-artifacts/ && \
             test -f /workspace/docker-artifacts/boot_a-docker-v2.img && \
             test -f /workspace/docker-artifacts/payload/lib/modules/4.9.209-hybris-g5eb4c03127-dirty/wlan.ko && \
             echo 'container artifacts OK'"

      - name: Run build inside Docker
        run: |
          sudo docker exec -e VENDOR="${VENDOR}" -e DEVICE="${DEVICE}" -e PORT_ARCH="${PORT_ARCH}" \
            -e RELEASE="${RELEASE}" -e DOCKER_ARTIFACTS_DIR="${DOCKER_ARTIFACTS_DIR}" \
            sailfish-sdk sh -c "cd /workspace && sudo -E bash ./run-mic-docker.sh"

      - name: List output files
        run: |
          sudo docker exec sailfish-sdk find /workspace/sfe-${DEVICE}-${RELEASE}/ -type f \( -name '*.zip' -o -name '*.md5sum' -o -name '*.sha1sum' -o -name '*.sha256sum' \) | sort

      - name: Archive artifacts
        run: |
          OUTPUT_DIR="${{ github.workspace }}/artifacts"
          sudo mkdir -p "$OUTPUT_DIR"
          for f in $(sudo docker exec sailfish-sdk sh -c "cd /workspace/sfe-${DEVICE}-${RELEASE}/ && ls *.zip *.md5sum *.sha1sum *.sha256sum 2>/dev/null"); do
            sudo docker cp "sailfish-sdk:/workspace/sfe-${DEVICE}-${RELEASE}/${f}" "$OUTPUT_DIR/"
          done

      - name: Verify flashable zip contains Docker kernel
        run: |
          ZIP=$(ls "${{ github.workspace }}"/artifacts/*.zip | head -1)
          echo "== 定位包内 sfos-rootfs.tar.bz2 的 hybris-boot.img 成员 =="
          MEMBER=$(unzip -p "$ZIP" sfos-rootfs.tar.bz2 | tar -tjf - | grep -E '(^|/)boot/hybris-boot\.img$' | head -1)
          echo "tarball 成员: $MEMBER"
          [ -n "$MEMBER" ] || { echo "错误: 包内未找到 hybris-boot.img"; exit 1; }
          echo "== 校验其 sha256 (应为 b17c9fbd...) =="
          BOOT_SHA=$(unzip -p "$ZIP" sfos-rootfs.tar.bz2 | tar -xjOf - "$MEMBER" | sha256sum | cut -d' ' -f1)
          echo "boot/hybris-boot.img sha256 = $BOOT_SHA"
          [ "$BOOT_SHA" = "b17c9fbd28529bcb4fe1e8514a74e9dfd991bb28470a3d6b662089f9b202783d" ] \
            || { echo "错误: 刷机包内 boot 镜像不是 Docker 内核!"; exit 1; }
          echo "== 校验 Docker 内核模块已入包 =="
          unzip -p "$ZIP" sfos-rootfs.tar.bz2 | tar -tjf - 2>/dev/null | grep -c 'lib/modules/4.9.209-hybris-g5eb4c03127-dirty/'
          echo "== 校验 paranoid-network 缓解已入包 (首次开机加组钩子) =="
          # defaultuser 由 user-managerd 在设备**首次开机**时才创建，mic 构建期的
          # /etc/passwd 里根本没有该用户，因此无法在校验期断言 "defaultuser ∈ gid 3003"；
          # 缓解是预置 /etc/oneshot.d/group.d/<gid3003组名> 文件，首次开机时
          # oneshot 的 groupadd-user.later 会把 defaultuser 自动加入该组。
          readonly GROUP_MEMBER=$(unzip -p "$ZIP" sfos-rootfs.tar.bz2 | tar -tjf - | grep -E '(^|/)etc/group$' | head -1)
          [ -n "$GROUP_MEMBER" ] || { echo "错误: 包内找不到 etc/group"; exit 1; }
          GROUP_LINE=$(unzip -p "$ZIP" sfos-rootfs.tar.bz2 | tar -xjOf - "$GROUP_MEMBER" | awk -F: '$3==3003' | head -1)
          echo "/etc/group gid3003 行: ${GROUP_LINE:-未找到}"
          [ -n "$GROUP_LINE" ] || { echo "错误: gid 3003 (AID_INET) 组不存在!"; exit 1; }
          GNAME=$(echo "$GROUP_LINE" | cut -d: -f1)
          echo "gid 3003 组名: $GNAME"
          HOOK=$(unzip -p "$ZIP" sfos-rootfs.tar.bz2 | tar -tjf - | grep -E "(^|/)etc/oneshot\.d/group\.d/$GNAME$" | head -1)
          echo "加组钩子: ${HOOK:-未找到}"
          [ -n "$HOOK" ] || { echo "错误: 刷机包未预置 /etc/oneshot.d/group.d/$GNAME (首次开机加组钩子)!"; exit 1; }
          readonly LATER_MEMBER=$(unzip -p "$ZIP" sfos-rootfs.tar.bz2 | tar -tjf - | grep -E '(^|/)etc/oneshot\.d/0/groupadd-user\.later$' | head -1)
          [ -n "$LATER_MEMBER" ] || { echo "错误: 包内缺少 groupadd-user.later (首次开机加组执行器)!"; exit 1; }
          echo "paranoid-network 缓解确认在包内 (浏览器问题首次开机后即免疫)"
          echo "== 上传产物列表 =="
          ls -la "${{ github.workspace }}"/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-fajita-docker-sailfishos
          path: ${{ github.workspace }}/artifacts/*

      - name: Upload image to Release
        uses: ncipollo/release-action@main
        with:
          tag: ${{ env.RELEASE_TAG }}
          artifacts: ${{ github.workspace }}/artifacts/*.zip
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            SailfishOS ${{ env.RELEASE }} fajita (OnePlus 6T) — Docker 内核刷机包

            内含:
            * Docker 内核 boot 镜像 (sha256 b17c9fbd28529bcb4fe1e8514a74e9dfd991bb28470a3d6b662089f9b202783d)
            * 配套内核模块 4.9.209-hybris-g5eb4c03127-dirty
            * 设备端 install-docker-kernel / rollback-docker-kernel 脚本与 stock boot 回滚备份

            刷机: TWRP 直接刷入 (需 LineageOS 16.0 底包)，zip 文件名含 SLOT_a 表示刷入 slot a。

      - name: Cleanup
        if: always()
        run: |
          sudo docker stop sailfish-sdk 2>/dev/null || true
          sudo docker rm sailfish-sdk 2>/dev/null || true