name: Build sailfishos for enchilada-new
'on':
  repository_dispatch:
  workflow_dispatch:
    inputs:
      set_example:
        description: "oneplus"
        required: true
        default: "enchilada"

env:
  VENDOR: oneplus
  DEVICE: enchilada
  PORT_ARCH: aarch64
  RELEASE: 5.0.0.73

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker container
        run: |
          sudo docker pull coderus/sailfishos-platform-sdk-base:latest
          sudo docker run --privileged --name sailfish-sdk -d \
            coderus/sailfishos-platform-sdk-base:latest tail -f /dev/null

      - name: Copy files into Docker container
        run: |
          sudo docker cp . sailfish-sdk:/workspace/

      - name: Run build inside Docker
        run: |
          sudo docker exec -e VENDOR="${VENDOR}" -e DEVICE="${DEVICE}" -e PORT_ARCH="${PORT_ARCH}" -e RELEASE="${RELEASE}" sailfish-sdk sh -c "cd /workspace && sudo -E bash ./run-mic2.sh"

      - name: List output files
        run: |
          sudo docker exec sailfish-sdk find /workspace/sfe-${DEVICE}-${RELEASE}/ -type f -name '*.zip' -o -name '*.md5sum' -o -name '*.sha1sum' -o -name '*.sha256sum' | sort

      - name: Archive artifacts
        run: |
          OUTPUT_DIR="${{ github.workspace }}/artifacts"
          sudo mkdir -p "$OUTPUT_DIR"
          for f in $(sudo docker exec sailfish-sdk sh -c "cd /workspace/sfe-${DEVICE}-${RELEASE}/ && ls *.zip 2>/dev/null"); do
            sudo docker cp "sailfish-sdk:/workspace/sfe-${DEVICE}-${RELEASE}/${f}" "$OUTPUT_DIR/"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-enchilada-sailfishos
          path: ${{ github.workspace }}/artifacts/*.zip

      - name: Upload image to Release
        uses: ncipollo/release-action@main
        with:
          tag: SailfishOS_for_enchilada
          artifacts: ${{ github.workspace }}/artifacts/*.zip
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            SailfishOS_for_enchilada

      - name: Cleanup
        if: always()
        run: |
          sudo docker stop sailfish-sdk 2>/dev/null || true
          sudo docker rm sailfish-sdk 2>/dev/null || true