name: Build sailfishos for fajita-new
'on':
  repository_dispatch:
  workflow_dispatch:
    inputs:
      set_example:
        description: "oneplus"
        required: true
        default: "fajita"

env:
  VENDOR: oneplus
  DEVICE: fajita
  PORT_ARCH: aarch64
  RELEASE: 5.0.0.73
  # Docker container name
  SDK_CONTAINER: sailfish-sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker container
        run: |
          sudo docker pull coderus/sailfishos-platform-sdk-base:latest
          sudo docker run --privileged --name $SDK_CONTAINER -d \
            coderus/sailfishos-platform-sdk-base:latest tail -f /dev/null

      - name: Copy files into Docker container
        run: |
          sudo docker cp . $SDK_CONTAINER:/workspace/

      - name: Run build inside Docker
        run: |
          sudo docker exec $SDK_CONTAINER sh -c "
            cd /workspace &&
            export VENDOR=$VENDOR DEVICE=$DEVICE PORT_ARCH=$PORT_ARCH RELEASE=$RELEASE &&
            sudo bash ./run-mic1.sh
          "

      - name: Detect built artifacts
        id: detect-artifacts
        run: |
          OUTDIR=$(sudo docker exec $SDK_CONTAINER sh -c "
            cd /workspace && ls -d sfe-${DEVICE}-${RELEASE}* 2>/dev/null | head -1
          ")
          echo "OUTDIR=${OUTDIR}" >> $GITHUB_OUTPUT

          ZIPFILE=$(sudo docker exec $SDK_CONTAINER sh -c "
            ls /workspace/${OUTDIR}/*.zip 2>/dev/null | head -1
          ")
          echo "ZIPFILE=${ZIPFILE}" >> $GITHUB_OUTPUT

      - name: List files in Docker container
        run: |
          sudo docker exec $SDK_CONTAINER ls -R /workspace

      - name: Archive artifacts
        run: |
          sudo docker exec $SDK_CONTAINER ls -ltrh /workspace/${{ steps.detect-artifacts.outputs.OUTDIR }}/
          sudo mkdir -p ${{ github.workspace }}/artifacts/
          sudo docker cp $SDK_CONTAINER:/workspace/${{ steps.detect-artifacts.outputs.ZIPFILE }} \
            ${{ github.workspace }}/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-fajita-sailfishos
          path: ${{ github.workspace }}/artifacts/*.zip

      - name: Cleanup
        run: |
          sudo docker stop $SDK_CONTAINER
          sudo docker rm $SDK_CONTAINER

      - name: Upload image to Release
        uses: ncipollo/release-action@main
        with:
          tag: SailfishOS_for_fajita
          artifacts: ${{ github.workspace }}/artifacts/*.zip
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            SailfishOS_for_fajita